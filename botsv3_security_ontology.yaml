implementation_notes:
  graph_database:
    neo4j:
      node_labels: 使用 node_types 作为 label。
      relationship_types: 使用 relationship_types 中的 key 作为关系类型。
      constraints:
        - Event.event_id unique
        - Host.asset_id unique when exists
        - Process.process_guid unique within Host
        - IP.ip_address indexed
        - Domain.fqdn indexed
        - Hash.algorithm + Hash.value unique
        - CloudResource.arn unique when exists
    property_graph:
      recommendation: >
        若使用属性图，语义关系直接作为边，evidence_event_ids 保存在边属性中。
    rdf_owl:
      recommendation: >
        若要形式化推理，可将 node_types 映射为 Class，relationship_types 映射为 ObjectProperty，properties 映射为 DataProperty。

  extraction_pipeline:
    stages:
      - parse_raw_event
      - normalize_event_type
      - extract_entities
      - resolve_entities
      - extract_relation_facts
      - attach_evidence
      - temporal_aggregate_selected_relations
      - write_graph

  minimum_viable_schema:
    nodes:
      - Event
      - User
      - Host
      - Process
      - File
      - Hash
      - IP
      - Domain
      - URL
      - EmailMessage
      - IAMPrincipal
      - CloudAPI
      - CloudResource
      - Detection
    relationships:
      - OBSERVED_ON
      - ACTOR
      - TARGET
      - LOGIN_TO
      - EXECUTED
      - RUNS_PROCESS
      - SPAWNED
      - CONNECTED_TO
      - QUERIED_DOMAIN
      - RESOLVED_TO
      - REQUESTED_URL
      - HAS_ATTACHMENT
      - HAS_HASH
      - CALLED_API
      - AFFECTED_RESOURCE
      - ACCESSED_OBJECT
      - FLAGS
