normalization_rules:
  host_resolution:
    priority:
      - asset_id
      - cloud_instance_id
      - fqdn
      - hostname + domain
      - hostname + time_window + ip
    notes:
      - IP 只能作为辅助特征，不应直接等同 Host。
      - DHCP、NAT、云弹性 IP 场景必须保留时间范围。

  user_resolution:
    normalize:
      - lower_case_domain_and_username
      - strip_realm_variants
      - map_email_to_user_when_confident
    examples:
      - raw: CORP\\alice
        account_name: alice
        namespace: CORP
      - raw: alice@example.com
        account_name: alice@example.com
        namespace: example.com
    notes:
      - User 与 Account 分离，避免误合并服务账号、外部邮箱和本地账号。

  process_resolution:
    priority:
      - host_id + process_guid
      - host_id + pid + image + start_time_window
    notes:
      - pid 可复用，不能单独作为进程唯一键。
      - 进程名只能用于 Executable 或属性，不能作为 Process 唯一键。

  file_resolution:
    priority:
      - sha256
      - sha1
      - md5
      - host_id + normalized_path + time_window
      - storage_uri
    notes:
      - 同一路径不一定同一文件，同一 hash 才更接近同一内容。
      - 邮件附件、落地文件、S3 Object 可以通过 Hash 关联。

  domain_url_resolution:
    domain:
      - lower_case_fqdn
      - extract_registrable_domain
    url:
      - normalize_scheme_host_path
      - optionally_hash_query_string
    notes:
      - URL 粒度细，Domain 粒度粗。C2 聚类通常看 Domain，下载溯源通常看 URL。

  cloud_resource_resolution:
    priority:
      - arn
      - cloud_provider + account_id + region + resource_type + resource_name
      - bucket_name + object_key
    notes:
      - S3 Bucket 和 S3 Object 可以都建为 CloudResource，也可将 Object 同时映射为 File。

temporal_policy:
  default_relation_time_fields:
    - event_time
    - start_time
    - end_time
    - first_seen
    - last_seen
  aggregation:
    no_aggregation_by_default:
      - LOGIN_TO
      - EXECUTED
      - SPAWNED
      - CREATED_FILE
      - DELETED_FILE
      - CALLED_API
      - AFFECTED_RESOURCE
      - SENT_EMAIL
      - HAS_ATTACHMENT
    aggregate_by_time_window:
      CONNECTED_TO:
        window: 1m_or_5m
        group_by:
          - src_entity
          - dest_entity
          - protocol
          - dest_port
      REQUESTED_URL:
        window: 1m_or_5m
        group_by:
          - src_entity
          - url_or_domain
          - method
          - status_code
      QUERIED_DOMAIN:
        window: 1m_or_5m
        group_by:
          - src_entity
          - domain
          - record_type
  ordering:
    description: >
      攻击链推理应优先使用 event_time 排序；当日志时钟不可信时，使用 ingest_time 和 source-specific ordering 辅助。

relation_fact_pattern:
  description: >
    如果底层图数据库不支持边属性或边到边的证据连接，可以显式引入 RelationFact 节点。
  example:
    nodes:
      - Process:powershell_instance
      - IP:c2_ip
      - RelationFact:connected_to_fact
      - Event:sysmon_network_event
    edges:
      - Process:powershell_instance -> SOURCE_OF -> RelationFact:connected_to_fact
      - RelationFact:connected_to_fact -> DESTINATION_OF -> IP:c2_ip
      - Event:sysmon_network_event -> SUPPORTS -> RelationFact:connected_to_fact

attack_path_templates:
  phishing_to_execution:
    description: 钓鱼邮件导致附件落地并执行。
    path:
      - EmailAccount -> SENT_EMAIL -> EmailMessage
      - EmailMessage -> RECEIVED_BY -> EmailAccount
      - EmailMessage -> HAS_ATTACHMENT -> File
      - File -> HAS_HASH -> Hash
      - User -> EXECUTED -> Process
      - Process -> READ_FILE -> File
      - Process -> SPAWNED -> Process
      - Process -> CONNECTED_TO -> IP

  endpoint_c2:
    description: 终端进程连接 C2 基础设施。
    path:
      - User -> LOGIN_TO -> Host
      - Host -> RUNS_PROCESS -> Process
      - Process -> SPAWNED -> Process
      - Process -> QUERIED_DOMAIN -> Domain
      - Domain -> RESOLVED_TO -> IP
      - Process -> CONNECTED_TO -> IP

  lateral_movement:
    description: 横向移动。
    path:
      - IP -> LOGIN_AS -> User
      - User -> LOGIN_TO -> Host
      - User -> EXECUTED -> Process
      - Process -> CONNECTED_TO -> IP
      - IP -> LOGIN_AS -> User
      - User -> LOGIN_TO -> Host

  cloud_exfiltration:
    description: 云凭证被使用后访问对象存储并下载数据。
    path:
      - IP -> USED_CREDENTIAL -> IAMPrincipal
      - IAMPrincipal -> CALLED_API -> CloudAPI
      - CloudAPI -> AFFECTED_RESOURCE -> CloudResource
      - IAMPrincipal -> ACCESSED_OBJECT -> CloudResource
      - CloudResource -> HAS_HASH -> Hash

  detection_explanation:
    description: 从告警回溯到证据和实体。
    path:
      - Detection -> FLAGS -> Entity
      - Event -> GENERATED -> Detection
      - Event -> ACTOR -> Entity
      - Event -> TARGET -> Entity
      - Event -> OBSERVED_ON -> Host

